<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QWantum AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>QWantum <span>AI</span></h1>
      <p class="tagline">Le pont vers un autre monde</p>
    </header>

    <div class="chat-box" id="chat-box">
      <div class="message bot">
        Bonjour, je suis QWantum AI. Comment puis-je t'aider aujourd'hui ?
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="user-input" placeholder="Écris ton message ici...">
      <button id="send-btn">Envoyer</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
